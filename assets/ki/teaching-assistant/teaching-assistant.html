html, body { margin: 0; }
body { font-family: var(--font); color: var(--text); background: var(--bg); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
[hidden] { display: none !important; }
.ic { width: 20px; height: 20px; flex: none; }

/* ===================== Dashboard ===================== */
.shell { display: grid; grid-template-columns: 240px minmax(0, 1fr); min-height: 100vh; }
.side { position: sticky; top: 0; height: 100vh; background: var(--side-bg); color: var(--side-text); padding: 22px 14px 18px; display: flex; flex-direction: column; gap: 28px; }
.brand { display: flex; align-items: center; gap: 12px; padding: 0 8px; color: #F0F0F5; }
.brand-mark { width: 36px; height: 36px; flex: none; }
.brand-name { font-weight: 700; font-size: 17px; line-height: 1.15; letter-spacing: -.01em; }
.brand-sub { font-size: 13px; color: var(--side-text); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav button { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 0; background: none; border-radius: 10px; text-align: left; cursor: pointer; font-size: 15px; font-weight: 500; color: var(--side-text); transition: background .15s, color .15s; }
.nav button:hover { background: var(--side-hover); color: #F0F0F5; }
.nav button[aria-current="page"] { background: var(--side-active); color: #FFFFFF; font-weight: 600; }
.nav button:focus-visible { outline-color: #8FB0E8; }
.side-foot { margin-top: auto; padding: 0 10px; font-size: 12.5px; line-height: 1.45; }
.side-foot .credit { display: block; margin-top: 8px; color: inherit; font-weight: 700; text-decoration: none; opacity: .8; }
.side-foot .credit:hover { opacity: 1; text-decoration: underline; text-underline-offset: 3px; }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; gap: 18px; padding: 12px 32px; min-height: 64px; background: var(--topbar); backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--border); flex-wrap: wrap; }
.class-pick { display: flex; align-items: center; gap: 10px; }
.class-pick label { color: var(--text-2); font-size: 14px; }
.class-pick select { font-weight: 700; font-size: 16px; padding: 8px 38px 8px 14px; border: 1px solid var(--border-strong); border-radius: 10px; background: var(--field) var(--chevron) no-repeat right 14px center; appearance: none; cursor: pointer; max-width: 260px; }
.status { display: flex; align-items: center; gap: 8px; color: var(--text-2); font-size: 13.5px; font-weight: 500; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
.dot.on { background: var(--green); box-shadow: 0 0 0 3px color-mix(in srgb, var(--green) 22%, transparent); }
.spacer { flex: 1; }

.page { padding: 30px 32px 72px; max-width: 1280px; width: 100%; }
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 22px; flex-wrap: wrap; }
h1 { font-size: 30px; line-height: 1.15; margin: 0; font-weight: 800; letter-spacing: -.025em; }
h2 { font-size: 17px; line-height: 1.3; margin: 0; font-weight: 700; letter-spacing: -.01em; }
h3 { font-size: 15px; margin: 18px 0 6px; font-weight: 700; }
p { margin: 0 0 10px; }
.lead { color: var(--text-2); margin: 6px 0 0; max-width: 66ch; }
.muted { color: var(--text-2); }
.small { font-size: 13.5px; }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 18px; align-items: stretch; }
.s4 { grid-column: span 4; } .s5 { grid-column: span 5; } .s6 { grid-column: span 6; }
.s7 { grid-column: span 7; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.panel { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 20px 22px; min-width: 0; box-shadow: var(--shadow); }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; margin-bottom: 16px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 14px; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 9px 16px; border-radius: 10px; border: 1px solid var(--border-strong); background: var(--field); color: var(--text); cursor: pointer; font-weight: 600; font-size: 14.5px; line-height: 1.2; white-space: nowrap; text-decoration: none; transition: background .15s, border-color .15s, color .15s; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--accent-soft); }
.btn.lg { padding: 13px 22px; font-size: 16.5px; border-radius: 12px; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn.icon-only { padding: 9px; }
.btn.danger { color: var(--danger); border-color: var(--danger-line); }
.btn.danger:hover { border-color: var(--danger); }
.btn.armed, .btn.armed:hover { background: #C65A46; border-color: #C65A46; color: #FFFFFF; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.row.nowrap { flex-wrap: nowrap; }
.row + .row { margin-top: 10px; }
.chip { padding: 6px 13px; border-radius: 999px; border: 1px solid var(--border); background: var(--muted); cursor: pointer; font-size: 13.5px; font-weight: 600; transition: background .15s, border-color .15s; }
.chip:hover { border-color: var(--border-strong); }
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.seg { display: inline-flex; background: var(--muted); border-radius: 10px; padding: 3px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: none; padding: 6px 13px; border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 13.5px; color: var(--text-2); transition: color .15s, background .15s; }
.seg button:hover { color: var(--text); }
.seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--text); box-shadow: 0 1px 2px rgba(26, 31, 58, .14), 0 2px 8px rgba(26, 31, 58, .06); }
.link { border: 0; background: none; padding: 0; color: var(--text); cursor: pointer; text-align: left; font-weight: 600; text-decoration: underline; text-decoration-color: var(--border-strong); text-underline-offset: 3px; }
.link:hover { text-decoration-color: currentColor; }

.field { display: flex; flex-direction: column; gap: 6px; }
.field > span { font-size: 13.5px; font-weight: 500; color: var(--text-2); }
input[type=text], input[type=number], textarea, select.input { border: 1px solid var(--border-strong); border-radius: 10px; padding: 9px 12px; background: var(--field); width: 100%; min-width: 0; }
input[type=text]:focus, input[type=number]:focus, textarea:focus, select.input:focus { border-color: var(--focus); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--focus) 22%, transparent); }
textarea { resize: vertical; min-height: 70px; }
input.num { width: 84px; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; }
.check input[type=checkbox], .check input[type=radio] { width: 18px; height: 18px; accent-color: var(--accent); margin: 2px 0 0; flex: none; }
.setting { display: flex; flex-direction: column; gap: 7px; margin-bottom: 18px; }
.setting > span:first-child { font-weight: 700; }

/* Zufall */
.pick-result { font-weight: 800; font-size: 46px; line-height: 1.05; letter-spacing: -.03em; margin: 4px 0 22px; overflow-wrap: anywhere; }
.pick.big .pick-result { font-size: 76px; margin: 12px 0 28px; }
.pick-result.empty { font-weight: 400; font-size: 17px; letter-spacing: 0; color: var(--text-2); padding: 16px 0 6px; }
.pick-result.pop { animation: pop .45s cubic-bezier(.2, 1.5, .4, 1); }
@keyframes pop { from { transform: scale(.88); opacity: .2; } to { transform: none; opacity: 1; } }
.namelist { color: var(--text-2); }
.hist { list-style: none; margin: 0; padding: 0; }
.hist li { display: flex; gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--border); }
.hist time { color: var(--text-2); font-variant-numeric: tabular-nums; min-width: 44px; }
.presence { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.presence .chip[aria-pressed="true"] { background: var(--field); border-color: var(--border-strong); color: var(--text); }
.presence .chip[aria-pressed="false"] { background: transparent; border-style: dashed; color: var(--text-3); text-decoration: line-through; }

/* Timer */
.timer-display { font-weight: 700; font-size: 64px; line-height: 1; letter-spacing: -.01em; font-variant-numeric: tabular-nums; }
.timer.big .timer-display { font-size: 104px; }
.bar { height: 6px; background: var(--muted); border-radius: 99px; overflow: hidden; margin: 16px 0; }
.bar > span { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 99px; transition: width .3s linear; }
.bar.gold > span { background: var(--gold); }
.chips { margin-bottom: 14px; gap: 6px; }

/* Ampel & Sterne */
.as-panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 28px; }
.as-ampel { border-right: 1px solid var(--border); padding-right: 28px; }
.as-row { display: flex; gap: 22px; align-items: center; }
.as-meter { flex: 1; min-width: 0; }
.as-meter p { margin: 10px 0 0; }
.mini-ampel { background: var(--housing); border-radius: 16px; padding: 8px; display: grid; gap: 6px; flex: none; box-shadow: inset 0 0 0 1px rgba(255, 255, 255, .06); }
.mini-ampel .lamp { width: 32px; height: 32px; border-radius: 50%; background: rgba(255, 255, 255, .08); border: 0; padding: 0; cursor: default; transition: background .3s, box-shadow .3s; }
.mini-ampel .lamp:disabled { opacity: 1; }
.mini-ampel.manual .lamp { cursor: pointer; }
.mini-ampel.manual .lamp:hover { box-shadow: inset 0 0 0 2px rgba(255, 255, 255, .35); }
.mini-ampel.big { border-radius: 24px; padding: 11px; gap: 9px; }
.mini-ampel.big .lamp { width: 56px; height: 56px; }
.mini-ampel[data-light="red"] .lamp.red { background: var(--l-red); box-shadow: 0 0 16px var(--l-red); }
.mini-ampel[data-light="yellow"] .lamp.yellow { background: var(--l-yellow); box-shadow: 0 0 16px var(--l-yellow); }
.mini-ampel[data-light="green"] .lamp.green { background: var(--l-green); box-shadow: 0 0 16px var(--l-green); }
.meter { position: relative; height: 14px; border-radius: 99px; overflow: hidden; background: linear-gradient(90deg, var(--zone-g) 0 var(--y), var(--zone-y) var(--y) var(--r), var(--zone-r) var(--r) 100%); }
.meter.big { height: 24px; }
.meter-fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--green); border-radius: 99px; transition: width .12s linear; }
.meter-fill[data-zone="yellow"] { background: #E0A93B; }
.meter-fill[data-zone="red"] { background: var(--red); }
.meter .mark { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--text); opacity: .35; }
.meter .mark[data-mark="yellow"] { left: var(--y); }
.meter .mark[data-mark="red"] { left: var(--r); }
.meter-scale { display: flex; justify-content: space-between; font-size: 12.5px; color: var(--text-2); margin-top: 6px; }
.laut-row { display: flex; gap: 32px; align-items: center; margin-bottom: 18px; }
.laut-meter { flex: 1; min-width: 0; }
.laut-value { display: flex; align-items: baseline; gap: 10px; margin-bottom: 10px; }
.laut-value span:first-child { font-weight: 800; font-size: 48px; line-height: 1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; min-width: 2ch; }
.range-row { display: grid; grid-template-columns: 150px minmax(0, 1fr) 70px; gap: 14px; align-items: center; padding: 9px 0; }
.range-row > span { font-weight: 600; }
.range-row output { font-weight: 700; text-align: right; font-variant-numeric: tabular-nums; }
.tips { margin: 0 0 16px; padding-left: 20px; color: var(--text-2); }
.tips li { margin-bottom: 8px; }

.stars-block { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 18px; align-items: center; }
.starfill { width: 72px; height: 72px; overflow: visible; }
.starfill .star-bg { fill: var(--star-bg); }
.starfill .star-level { fill: var(--gold); transform-box: fill-box; transform-origin: 50% 100%; transform: scaleY(0); transition: transform .6s ease; }
.starfill .star-outline { fill: none; stroke: var(--gold); stroke-width: 3.5; stroke-linejoin: round; }
.star-total { font-weight: 800; font-size: 44px; line-height: 1; letter-spacing: -.03em; }
.star-total .unit { font-size: 15px; font-weight: 600; letter-spacing: 0; color: var(--text-2); }
.stars-goal { grid-column: 1 / -1; margin-top: 14px; }
.goal-line { display: flex; justify-content: space-between; gap: 10px; font-size: 14.5px; font-weight: 500; }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; margin: 22px 0 0; padding-top: 18px; border-top: 1px solid var(--border); }
.stats dt { font-size: 13px; font-weight: 500; color: var(--text-2); }
.stats dd { margin: 2px 0 0; font-weight: 800; font-size: 28px; line-height: 1.1; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }

.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 99px; font-size: 11.5px; font-weight: 700; flex: none; }
.badge.green { background: var(--card-green); color: #FFFFFF; }
.badge.yellow { background: var(--card-yellow); color: #1A1F3A; }
.badge.red { background: var(--card-red); color: #FFFFFF; }

/* Karten */
.tbl { width: 100%; border-collapse: collapse; }
.tbl th, .tbl td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.tbl th { font-size: 13px; font-weight: 600; color: var(--text-2); white-space: nowrap; }
.tbl .num { text-align: right; font-variant-numeric: tabular-nums; width: 56px; }
.tbl .zero { color: var(--text-3); }
.tbl input[type=text] { padding: 6px 9px; }
.log { list-style: none; margin: 0; padding: 0; }
.log li { display: flex; gap: 12px; align-items: flex-start; padding: 11px 0; border-bottom: 1px solid var(--border); }
.log .badge { width: 12px; min-width: 12px; height: 16px; padding: 0; border-radius: 3px; margin-top: 3px; }
.log-main { flex: 1; min-width: 0; }
.log-note { margin-top: 3px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--text-2); }

/* Klassen und Import */
.class-list { list-style: none; margin: 0 0 16px; padding: 0; display: grid; gap: 6px; }
.class-item { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 11px 14px; border: 1px solid var(--border); border-radius: 12px; background: var(--field); cursor: pointer; text-align: left; transition: border-color .15s; }
.class-item:hover { border-color: var(--border-strong); }
.class-list li.active .class-item { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.drop { display: block; border: 1.5px dashed var(--border-strong); border-radius: 14px; padding: 28px 18px; text-align: center; background: var(--muted); cursor: pointer; transition: border-color .15s, background .15s; }
.drop:hover, .drop.over { border-color: var(--accent); background: var(--accent-soft); }
.drop strong { display: block; font-size: 16px; margin-bottom: 2px; }
details { margin: 16px 0 6px; }
summary { cursor: pointer; font-weight: 600; }
details textarea { margin: 10px 0 8px; }
.mic-warn { margin: 10px 0 0; padding: 10px 12px; border-radius: 10px; background: color-mix(in srgb, var(--card-red) 13%, transparent); color: var(--text); font-size: 14px; line-height: 1.45; }
.mic-warn[hidden] { display: none; }
details.diag { margin: 0; }
details.diag p { margin: 8px 0; }
details.diag pre { margin: 0; padding: 12px 14px; border-radius: 10px; background: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; font: 12.5px/1.6 ui-monospace, Menlo, monospace; color: var(--text-2); }
.imp { scroll-margin-top: 90px; margin-top: 22px; padding-top: 20px; border-top: 1px solid var(--border); }
.imp h3 { margin-top: 0; }
.table-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 12px; margin-bottom: 8px; }
.imp-table { border-collapse: collapse; width: 100%; font-size: 14px; }
.imp-table th { padding: 7px; background: var(--muted); min-width: 130px; }
.imp-table td { padding: 7px 10px; border-top: 1px solid var(--border); white-space: nowrap; }
.imp-table tr.is-head td { color: var(--text-3); text-decoration: line-through; }
.targets { border: 0; padding: 0; margin: 14px 0; display: grid; gap: 10px; }
.targets legend { font-weight: 700; margin-bottom: 8px; padding: 0; }
.targets .check { align-items: center; }
.targets select, .targets input[type=text] { width: 220px; max-width: 100%; }
.two { display: grid; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); gap: 28px; align-items: start; }
.inline-name { max-width: 200px; font-weight: 700; }

/* Dialog */
dialog { border: 0; border-radius: 20px; padding: 0; width: min(540px, calc(100vw - 32px)); max-height: calc(100vh - 40px); background: var(--card); color: var(--text); box-shadow: 0 30px 80px rgba(10, 20, 45, .28), 0 0 0 1px var(--border); }
dialog::backdrop { background: rgba(10, 20, 45, .42); backdrop-filter: blur(3px); }
.dlg { padding: 24px 26px 26px; }
.dlg-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 16px; }
.dlg-title { font-size: 24px; font-weight: 800; letter-spacing: -.02em; }
.dlg-head p { margin: 2px 0 0; }
.iconbtn { border: 0; background: var(--muted); font-size: 22px; line-height: 1; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; color: var(--text-2); flex: none; }
.iconbtn:hover { color: var(--text); }
.dlg .field { margin-bottom: 12px; }
.card-buttons { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin: 18px 0 20px; }
.cardbtn { height: 128px; border: 0; border-radius: 14px; font-weight: 700; font-size: 15.5px; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 10px; padding: 12px; transition: transform .16s ease, box-shadow .16s ease; box-shadow: 0 2px 0 rgba(0, 0, 0, .12); }
.cardbtn:hover { transform: translateY(-3px) rotate(-2.5deg); box-shadow: 0 10px 24px rgba(10, 20, 45, .18); }
.cardbtn.green { background: var(--card-green); color: #FFFFFF; }
.cardbtn.yellow { background: var(--card-yellow); color: #1A1F3A; }
.cardbtn.red { background: var(--card-red); color: #FFFFFF; }
.cardbtn svg { width: 32px; height: 32px; margin-bottom: auto; margin-top: 12px; }
.dlg .log { margin-top: 4px; }

/* Toasts */
.toasts { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 100; align-items: center; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--toast-bg); color: var(--toast-fg); padding: 11px 16px; border-radius: 12px; display: flex; gap: 16px; align-items: center; font-size: 14.5px; font-weight: 500; box-shadow: 0 12px 32px rgba(10, 20, 45, .22); animation: toast-in .2s ease-out; }
.toast button { background: none; border: 0; color: var(--toast-link); font-weight: 700; cursor: pointer; padding: 0; }
@keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

.empty { max-width: 640px; padding: 48px 0; }
.empty h1 { font-size: 40px; }
.empty .row { margin-top: 26px; }
.guide { margin: 0; padding-left: 22px; }
.guide li { margin-bottom: 8px; }
.confirm-box { margin: 14px 0; padding: 14px 16px; border: 1px solid var(--border-strong); border-radius: 12px; background: var(--notice); }

@media (max-width: 1020px) {
  .s4, .s5, .s6, .s7, .s8 { grid-column: span 12; }
  .as-panel { grid-template-columns: 1fr; }
  .as-ampel { border-right: 0; padding-right: 0; border-bottom: 1px solid var(--border); padding-bottom: 22px; }
  .two { grid-template-columns: 1fr; }
}
@media (max-width: 760px) {
  .shell { grid-template-columns: 1fr; }
  .side { position: static; height: auto; flex-direction: row; align-items: center; overflow-x: auto; padding: 10px 14px; gap: 14px; }
  .nav { flex-direction: row; }
  .nav button { white-space: nowrap; }
  .brand-sub, .brand-text, .side-foot { display: none; }
  .topbar { position: static; padding: 10px 16px; }
  .page { padding: 20px 16px 60px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .range-row { grid-template-columns: 1fr 60px; }
  .range-row > span { grid-column: 1 / -1; }
  .laut-row { flex-direction: column; align-items: stretch; }
  .laut-row .mini-ampel { grid-auto-flow: column; justify-self: start; width: max-content; }
  .pick.big .pick-result { font-size: 56px; }
  .timer.big .timer-display { font-size: 76px; }
}

/* ===================== Beamer ===================== */
body.beamer { background: #0A1A3A; overflow: hidden; }
body.beamer.idle, body.beamer.idle * { cursor: none !important; }
.bm {
  --b-text: #F0F0F5;
  --b-dim: rgba(240, 240, 245, .62);
  --b-faint: rgba(240, 240, 245, .12);
  --b-line: rgba(240, 240, 245, .14);
  --b-star: #F3BE5C;
  --b-warn: #F6BE4F;
  --b-end: #F26B55;
  --b-housing: #071229;
  --b-overlay: rgba(7, 16, 38, .94);
  --b-pill: rgba(255, 255, 255, .08);
  position: fixed; inset: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 2vmin; padding: 4.2vmin 5vmin 3.6vmin; color: var(--b-text);
  background:
    radial-gradient(85% 70% at 12% 0%, rgba(143, 176, 232, .17), transparent 62%),

.bm-ampel { display: flex; align-items: stretch; gap: 2.4vmin; }

.housing[data-light="red"] .lamp.red { background: radial-gradient(circle at 42% 34%, #FFD6CE 0, var(--l-red) 42%, #C43F2C 100%); box-shadow: 0 0 6.5vmin 1vmin rgba(242, 107, 85, .55), inset 0 -.6vmin 1.2vmin rgba(0, 0, 0, .18); }
.housing[data-light="yellow"] .lamp.yellow { background: radial-gradient(circle at 42% 34%, #FFF0CC 0, var(--l-yellow) 42%, #D3961F 100%); box-shadow: 0 0 6.5vmin 1vmin rgba(246, 190, 79, .5), inset 0 -.6vmin 1.2vmin rgba(0, 0, 0, .15); }
.housing[data-light="green"] .lamp.green { background: radial-gradient(circle at 42% 34%, #D2FFE4 0, var(--l-green) 42%, #2E9E61 100%); box-shadow: 0 0 6.5vmin 1vmin rgba(92, 201, 138, .5), inset 0 -.6vmin 1.2vmin rgba(0, 0, 0, .15); }
.levelbar { position: relative; width: 1.6vmin; border-radius: 99px; background: var(--b-faint); margin: 3vmin 0; }
.levelbar .fill { position: absolute; left: 0; right: 0; bottom: 0; height: 0; border-radius: 99px; background: var(--b-text); transition: height .12s linear; }

.bm-bottom { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 5vmin; align-items: center; border-top: .25vmin solid var(--b-line); padding-top: 2.8vmin; }

@keyframes starpop { 30% { transform: scale(1.28) rotate(-8deg); } }

/* Zehnerfeld: Reihen zu je 10 Sternen, die Größe passt sich der Breite an */
.slots { display: grid; grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); gap: .7vmin; flex: 0 1 calc(var(--cols) * var(--max)); min-width: 0; }

.goal-bar span { display: block; height: 100%; background: var(--b-star); border-radius: 99px; }
.goal-count { font-weight: 700; font-size: 4.2vmin; white-space: nowrap; }

.plus { position: absolute; left: 6vmin; top: -2vmin; font-weight: 800; font-size: 7vmin; color: var(--b-star); pointer-events: none; animation: floatup 1.6s ease-out forwards; }
.plus.minus { color: var(--b-end); }
@keyframes floatup { from { transform: translateY(0); opacity: 1; } to { transform: translateY(-14vmin); opacity: 0; } }

.bm-overlay { position: fixed; inset: 0; z-index: 10; display: none; align-items: center; justify-content: center; text-align: center; padding: 6vmin; background: var(--b-overlay); backdrop-filter: blur(10px); }
.bm-overlay.show { display: flex; animation: fade .25s ease-out; }
@keyframes fade { from { opacity: 0; } }

.ov-name { font-weight: 800; font-size: 21vmin; line-height: 1; letter-spacing: -.035em; overflow-wrap: anywhere; max-width: 92vw; }

.ov-card-text { text-align: left; }

.ov-card-kind { font-size: 5.4vmin; font-weight: 700; color: var(--b-dim); margin-top: 1.4vmin; }

.ov-goal .star-bg, .ov-goal .star-level { fill: var(--b-star); }
.ov-goal .star-outline { stroke: var(--b-star); }
.ov-liga { width: min(120vmin, 92vw); text-align: left; }
.ov-liga h2 { font-size: 8vmin; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.ov-liga .ov-small { margin: 2vmin 0 3.4vmin; }
.liga-row { display: grid; grid-template-columns: 8vmin minmax(0, 1fr) 34vmin 14vmin; align-items: center; gap: 2.4vmin; font-size: 4.6vmin; font-weight: 600; padding: 1.6vmin 0; border-bottom: .25vmin solid var(--b-line); }
.liga-row.me { color: var(--b-star); font-weight: 800; }
.liga-rank, .liga-val { font-variant-numeric: tabular-nums; }
.liga-val { text-align: right; }
.liga-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.liga-bar { height: 1.6vmin; background: var(--b-faint); border-radius: 99px; overflow: hidden; }
.liga-bar span { display: block; height: 100%; background: currentColor; border-radius: 99px; }
.bm-confetti { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 11; pointer-events: none; }
.bm-toasts { position: fixed; right: 5vmin; bottom: 22vmin; z-index: 12; display: flex; flex-direction: column; gap: 1.4vmin; align-items: flex-end; }
.bm-toast { background: var(--b-text); color: #0F2A5E; padding: 2vmin 3vmin; border-radius: 1.8vmin; font-size: 3.4vmin; font-weight: 700; box-shadow: 0 2vmin 5vmin rgba(0, 0, 0, .3); animation: toast-in .35s ease-out; }
.bm[data-theme="paper"] .bm-toast { color: #FAF7F2; }

/* Steuerleiste: erscheint nur bei Mausbewegung, im Leerlauf ist der Beamer frei */
.bm-controls { position: fixed; left: 50%; bottom: 2.6vmin; z-index: 20; display: flex; gap: 4px; padding: 6px; border-radius: 14px; background: rgba(6, 13, 32, .86); backdrop-filter: blur(14px); box-shadow: 0 12px 34px rgba(0, 0, 0, .35), inset 0 0 0 1px rgba(255, 255, 255, .09); opacity: 0; pointer-events: none; transform: translate(-50%, 8px); transition: opacity .25s, transform .25s; }
body.beamer:not(.idle) .bm-controls { opacity: 1; pointer-events: auto; transform: translate(-50%, 0); }
.bm-ctl { display: inline-flex; align-items: center; gap: 9px; border: 0; background: transparent; color: #F0F0F5; font-size: 14px; font-weight: 600; padding: 8px 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }

.bm-ctl .ic { width: 18px; height: 18px; }
.bm-ctl kbd { font-family: inherit; font-size: 11.5px; font-weight: 600; color: rgba(240, 240, 245, .66); border: 1px solid rgba(255, 255, 255, .18); border-radius: 5px; padding: 1px 6px; }
.bm-hint { position: fixed; left: 50%; top: 2.2vmin; transform: translateX(-50%); z-index: 15; font-size: 14px; font-weight: 500; background: rgba(6, 13, 32, .86); color: #F0F0F5; padding: 8px 14px; border-radius: 10px; white-space: nowrap; box-shadow: 0 8px 24px rgba(0, 0, 0, .3); }

/* ---------- Ergänzungen: Namens-Chips, Vokabeln, Tastenkürzel ---------- */
.btn kbd { font-family: inherit; font-size: 11px; font-weight: 700; line-height: 1.3; padding: 0 5px; border-radius: 5px; border: 1px solid currentColor; opacity: .55; }

.sus-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(214px, 1fr)); gap: 10px; }

.mini-card.green { --c: var(--card-green); color: #FFFFFF; }
.mini-card.yellow { --c: var(--card-yellow); color: #1A1F3A; }
.mini-card.red { --c: var(--card-red); color: #FFFFFF; }
/* Noch nicht vergeben: nur Umriss. Vergeben: gefüllt mit Zähler */
.mini-card[data-count="0"] { background: transparent; box-shadow: inset 0 0 0 2px var(--c); opacity: .75; }
.sus:hover .mini-card[data-count="0"], .mini-card[data-count="0"]:focus-visible { opacity: 1; }
.mini-card[data-count="0"]:hover { background: var(--c); }
.mini-card:hover { transform: translateY(-2px) rotate(-5deg); }
.mini-card:active { transform: scale(.92); }

.vocab-form { display: flex; gap: 8px; align-items: center; }

  .vocab-form { flex-wrap: wrap; }

  .vocab-item .row { grid-column: 1 / -1; justify-content: flex-end; }
}

/* Beamer: Vokabelspalte links, Uhr skaliert mit der freien Breite */
.bm-center { container-type: inline-size; }
.bm-clock { font-size: min(31vmin, 30cqi); }
.bm-timer-digits { font-size: min(33vmin, 30cqi); }

.bm.vocab-on .bm-vocab { display: flex; }

.bm.vocab-on.no-ampel .bm-main { grid-template-columns: 42vmin minmax(0, 1fr); }
.bm-vocab-head { display: flex; justify-content: space-between; align-items: baseline; gap: 2vmin; font-size: 3vmin; font-weight: 700; margin-bottom: 1.2vmin; }
.bm-vocab-head span { color: var(--b-dim); font-weight: 500; }
.bm-vocab-list { list-style: none; margin: 0; padding: 0; flex: 1; min-height: 0; overflow: hidden; -webkit-mask-image: linear-gradient(to bottom, #000 78%, transparent); mask-image: linear-gradient(to bottom, #000 78%, transparent); }

  *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

<script>
'use strict';

/* ============================================================
   Gemeinsame Helfer (Dashboard und Beamer)
   ============================================================ */
const STORE_KEY = 'teachingAssistant.v1';
const IS_BEAMER = location.hash === '#beamer';
// Auf classtiles.de liegt die Datei nur zum Laden. Die Website legt nichts auf dem Gerät ab (kein Cookie-Banner),
// also dort kein Speichern, kein Mikrofon, keine Wörterbuch-Abfrage, nur der Hinweis zum Herunterladen.
const HOSTED = /(^|\.)classtiles\.de$|^classtiles-labs\.github\.io$/.test(location.hostname);
const ROLE = IS_BEAMER ? 'beamer' : 'dash';
const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const $ = (sel, root = document) => root.querySelector(sel);
const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

/* ---------- Verbindung zwischen den Fenstern ----------
   Direkt per postMessage (Dashboard öffnet den Beamer) und zusätzlich per
   BroadcastChannel, falls der Beamer separat geöffnet wurde. Doppelte
   Nachrichten werden über ihre id verworfen. */
let peerWin = null;
let channel = null;
try { channel = new BroadcastChannel('teaching-assistant'); } catch (e) { channel = null; }
const seenIds = [];

function send(type, payload = {}) {
  const msg = { app: 'ta', from: ROLE, id: uid(), type, ...payload };
  if (peerWin && !peerWin.closed) { try { peerWin.postMessage(msg, '*'); } catch (e) { /* Fenster weg */ } }
  if (channel) { try { channel.postMessage(msg); } catch (e) { /* Kanal geschlossen */ } }
}
function listen(handler) {
  const receive = (msg, source) => {
    if (!msg || msg.app !== 'ta' || msg.from === ROLE || seenIds.includes(msg.id)) return;
    seenIds.push(msg.id);
    if (seenIds.length > 300) seenIds.splice(0, 100);
    handler(msg, source);
  };
  window.addEventListener('message', e => receive(e.data, e.source));
  if (channel) channel.onmessage = e => receive(e.data, null);
}

let audioCtx = null;
function getAudio() {
  if (!audioCtx) {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return null;
    audioCtx = new AC();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
  return audioCtx;
}
function tone(freq, start, dur, gain = .25, type = 'sine') {
  const ctx = getAudio();
  if (!ctx) return;
  const t0 = ctx.currentTime + start, o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.value = freq;
  g.gain.setValueAtTime(.0001, t0);
  g.gain.exponentialRampToValueAtTime(gain, t0 + .015);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g).connect(ctx.destination);
  o.start(t0); o.stop(t0 + dur + .05);
}
function playGong() {
  if (!store.settings.sound) return;
  [[784, 0], [659, .55], [523, 1.1]].forEach(([f, s]) => { tone(f, s, 2.4, .28); tone(f * 2.01, s, 1.2, .05); });
}
function playChime() {
  if (!store.settings.sound) return;
  tone(880, 0, .5, .14); tone(1318.5, .12, .9, .14);
}
function playFanfare() {
  if (!store.settings.sound) return;

  else t.state = 'idle';

}

  const t = store.timer, now = Date.now();
  if (t.state === 'running') { t.remainingSec = Math.max(0, (t.endAt - now) / 1000); t.state = 'paused'; }
  else if (t.state === 'paused') { t.endAt = now + t.remainingSec * 1000; t.state = 'running'; }
  else { t.remainingSec = t.durationSec; t.endAt = now + t.durationSec * 1000; t.state = 'running'; send('event', { name: 'hide' }); }
  getAudio();
  commit();
}

  const t = store.timer;
  if (t.state === 'running') { t.endAt += 60000; t.durationSec += 60; }
  else if (t.state === 'done') { t.durationSec = 60; t.remainingSec = 60; t.endAt = Date.now() + 60000; t.state = 'running'; send('event', { name: 'hide' }); }
  else { t.remainingSec += 60; t.durationSec = Math.max(t.durationSec, t.remainingSec); }
  commit();
}

function pickRandom() {
  const c = activeClass();
  if (!c) { toast('Wähle zuerst eine Klasse.'); return; }
  const pool = presentStudents(c);
  if (!pool.length) { toast('In dieser Klasse ist heute niemand als anwesend markiert.'); return; }
  let cands = pool;
  if (store.settings.pickNoRepeat) {
    cands = pool.filter(s => !c.pick.drawn.includes(s.id));
    if (!cands.length) { c.pick.drawn = []; cands = pool; toast('Alle waren dran. Eine neue Runde beginnt.'); }
  }
  const lastId = c.pick.history[0] && c.pick.history[0].id;
  if (cands.length > 1) cands = cands.filter(s => s.id !== lastId);
  const chosen = cands[randInt(cands.length)];
  c.pick.drawn.push(chosen.id);
  c.pick.history.unshift({ id: chosen.id, t: Date.now() });
  c.pick.history = c.pick.history.slice(0, 40);
  send('event', { name: 'pick', data: { name: displayName(chosen, c), roll: shuffle(pool.map(s => displayName(s, c))).slice(0, 24) } });
  rt.pickFlash = true;
  commit();
  rt.pickFlash = false;
}

/* ---------- Sterne ---------- */
function addStars(c, n) {
  if (!c || !n) return;
  const r = c.reward;
  if (n < 0 && r.total <= 0) return;
  r.total = Math.max(0, r.total + n);
  const w = weekBucket(r);
  w.stars = Math.max(0, w.stars + n);
  const g = r.goal;
  if (n > 0 && g.target > 0 && !g.reachedAt && r.total - g.base >= g.target) {
    g.reachedAt = Date.now();
    send('event', { name: 'goal', data: { reward: g.reward, target: g.target } });
    playFanfare();
    toast(`${c.name} hat das Klassenziel erreicht${g.reward ? ': ' + g.reward : ''}!`);
  } else {
    send('event', { name: 'star', data: { n, total: r.total } });
    if (n > 0) playChime();
  }
  rt.dirty = true;
  pushState();
}
function ligaRows() {
  const wk = weekKey(), mode = store.settings.ligaMode;
  return store.classes.map(c => {
    const w = c.reward.weeks[wk] || { stars: 0, activeSec: 0, greenSec: 0 };
    const rate = w.activeSec >= 600 ? w.stars / (w.activeSec / 2700) : 0;
    return { id: c.id, name: c.name, stars: w.stars, rate, quiet: w.activeSec ? w.greenSec / w.activeSec : 0, value: mode === 'rate' ? rate : w.stars };
  }).sort((a, b) => b.value - a.value || b.quiet - a.quiet);
}

async function startMic() {

    return null;
  }

  // damit auch Safari ihn sicher laufen lässt
  const AC = window.AudioContext || window.webkitAudioContext;
  const ctx = new AC();
  ctx.resume().catch(() => {});
  ctx.onstatechange = () => diagLog('Audio: ' + ctx.state);

    const stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false } });
    const src = ctx.createMediaStreamSource(stream);

    // das Fenster im Hintergrund auf eine Messung pro Sekunde drosselt
    an.fftSize = 32768;
    an.smoothingTimeConstant = 0;
    // Stumm an die Lautsprecher angeschlossen, damit jeder Browser den Zweig sicher verarbeitet
    const mute = ctx.createGain();
    mute.gain.value = 0;
    src.connect(an);
    an.connect(mute);
    mute.connect(ctx.destination);
    ctx.resume().catch(() => {});
    const mic = { ctx, stream, src, an, buf: new Float32Array(an.fftSize), silentSince: 0, lastResume: 0 };
    const track = stream.getAudioTracks()[0];
    track.onmute = () => diagLog('Spur stumm');
    track.onunmute = () => diagLog('Spur wieder aktiv');
    track.onended = () => diagLog('Spur beendet');
    Object.assign(rt.diag, { maxGap: 0, lastDb: null, maxDb: null, ctxStill: 0 });
    diagLog(`Mikrofon an: ${track.label || 'ohne Namen'}, Audio ${ctx.state}`);
    return mic;
  } catch (e) {
    ctx.close().catch(() => {});
    diagLog(`Mikrofon-Fehler: ${e.name} ${e.message}`);
    if (e.name === 'NotAllowedError') toast('Kein Zugriff aufs Mikrofon. Erlaube ihn über das Symbol in der Adressleiste und versuche es erneut.');

function engineTick() {
  const now = performance.now();
  const gap = rt.lastTick ? now - rt.lastTick : 0;
  const dt = Math.min(5, gap / 1000);
  rt.lastTick = now;
  timerCheck();
  const n = rt.noise, s = store.settings.noise;
  if (n.source === 'mic' && rt.mic) {
    const g = rt.diag;
    if (gap > g.maxGap) g.maxGap = gap;
    if (gap > 1500) diagLog(`Messpause ${fmtNum(Math.round(gap / 100) / 10)} Sek.`);
    const ctx = rt.mic.ctx;
    g.ctxStill = ctx.currentTime === g.ctxTime ? g.ctxStill + 1 : 0;

/* ---------- CSV-Import ---------- */
const HEADER_PATTERNS = [
  ['first', /^(vorname|vornamen|rufname|first ?name|given ?name)/],
  ['last', /^(nachname|familienname|zuname|last ?name|surname|family ?name)/],
  ['class', /^(klasse|klassen|kurs|lerngruppe|gruppe|class)/],
  ['full', /^(name|schüler|schueler|sus|student|kind)/],

const ROLE_OPTIONS = [['first', 'Vorname'], ['last', 'Nachname'], ['full', 'Ganzer Name'], ['class', 'Klasse'], ['ignore', 'Ignorieren']];

function decodeBytes(buf) {
  try { return new TextDecoder('utf-8', { fatal: true }).decode(buf); }
  catch (e) { return new TextDecoder('windows-1252').decode(buf); }   // ältere Excel-Exporte
}
function parseCSV(text, delim) {
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (quoted) {
      if (ch === '"') {
        if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false;
      } else field += ch;
    } else if (ch === '"' && field.trim() === '') { quoted = true; field = ''; }
    else if (ch === delim) { row.push(field); field = ''; }
    else if (ch === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (ch !== '\r') field += ch;
  }
  row.push(field); rows.push(row);
  return rows.map(r => r.map(f => f.trim())).filter(r => r.some(f => f !== ''));
}
function detectDelimiter(text) {
  const lines = text.split(/\r?\n/).filter(l => l.trim()).slice(0, 25);
  // "Nachname, Vorname" pro Zeile ist ein einzelnes Namensfeld, kein Komma-CSV
  if (lines.length && lines.every(l => /^[^,;\t|]+, [^,;\t|]+$/.test(l.trim()))) return '\u0000';
  let best = '\u0000', bestScore = 0;
  for (const d of [';', '\t', ',', '|']) {
    const rows = parseCSV(lines.join('\n'), d);
    if (!rows.length) continue;
    const freq = {};
    rows.forEach(r => { freq[r.length] = (freq[r.length] || 0) + 1; });
    const [mode, hits] = Object.entries(freq).sort((a, b) => b[1] - a[1])[0];
    if (+mode < 2) continue;
    const score = hits / rows.length + (d === ';' ? .01 : 0);
    if (score > bestScore) { best = d; bestScore = score; }
  }
  return best;
}
function detectHeader(row) {
  const map = row.map(cell => {
    const v = cell.toLowerCase().trim();
    const hit = HEADER_PATTERNS.find(([, re]) => re.test(v));
    return hit ? hit[0] : null;
  });
  if (!map.some(r => r === 'first' || r === 'last' || r === 'full')) return null;
  // "Name;Vorname" meint in Schullisten fast immer den Nachnamen
  if (map.includes('first') && !map.includes('last') && map.includes('full')) map[map.indexOf('full')] = 'last';
  return map.map(r => r || 'ignore');
}
function guessMap(rows, width) {
  if (width === 1) return ['full'];
  const map = Array(width).fill('ignore');
  const classLike = v => /^(\d{1,2}\s?[a-zA-Z]{0,3}|[a-zA-Z]{1,2}\s?\d{1,2}|EF)$/.test(v.trim());
  let classCol = -1;
  for (let i = 0; i < width && classCol < 0; i++) {
    const vals = rows.slice(0, 20).map(r => r[i] || '').filter(Boolean);
    if (vals.length && vals.every(classLike)) classCol = i;
  }
  if (classCol >= 0) map[classCol] = 'class';
  const nameCols = [...Array(width).keys()].filter(i => i !== classCol);
  if (nameCols.length === 1) map[nameCols[0]] = 'full';
  else { map[nameCols[0]] = 'first'; map[nameCols[1]] = 'last'; }

}

  if (full.includes(',')) {
    const [last, ...first] = full.split(',');
    return { first: first.join(',').trim(), last: last.trim() };
  }
  const parts = full.trim().split(/\s+/);
  if (parts.length === 1) return { first: parts[0], last: '' };
  return { first: parts.slice(0, -1).join(' '), last: parts[parts.length - 1] };
}

  let first = '', last = '', full = '', cls = '';
  map.forEach((role, i) => {
    const v = (r[i] || '').trim();
    if (!v) return;
    if (role === 'first') first = first ? `${first} ${v}` : v;
    else if (role === 'last') last = last ? `${last} ${v}` : v;
    else if (role === 'full') full = v;
    else if (role === 'class') cls = v;

  let rows = parseCSV(text, delim);
  if (!rows.length) { toast('In der Datei wurden keine Namen gefunden.'); return; }
  const width = Math.max(...rows.map(r => r.length));
  rows = rows.map(r => r.concat(Array(width - r.length).fill('')));
  const headerMap = detectHeader(rows[0]);
  const map = headerMap || guessMap(rows, width);
  const fromName = (fileName.match(/(?:^|[^a-z0-9])(\d{1,2}\s?[a-z]{1,2}|q[12]|ef)(?:[^a-z0-9]|$)/i) || [])[1] || '';
  rt.imp = {
    fileName, rows, map, hasHeader: !!headerMap,
    target: map.includes('class') ? 'column' : (activeClass() ? 'existing' : 'new'),
    classId: store.activeClassId,
    newName: fromName,
  };
  renderAll();

  if (box) box.scrollIntoView({ behavior: REDUCED_MOTION ? 'auto' : 'smooth', block: 'start' });
}
async function readImportFile(file) {
  if (/\.(xlsx?|ods|numbers)$/i.test(file.name)) {

}

}

}
function runImport() {

/* ---------- Vokabeln mit Wörterbuch ---------- */
const VOCAB_LANGS = { en: 'Englisch', fr: 'Französisch', es: 'Spanisch', it: 'Italienisch', la: 'Latein', nl: 'Niederländisch', pl: 'Polnisch', ru: 'Russisch', tr: 'Türkisch', pt: 'Portugiesisch' };
const langName = code => VOCAB_LANGS[code] || code;
const dictUrl = (lang, word) => `https://${lang === 'en' ? 'www' : 'de' + lang}.dict.cc/?s=${encodeURIComponent(word)}`;

// MyMemory liefert neben der Hauptübersetzung weitere Treffer. Bevorzugt werden
// Treffer, die so viele Wörter haben wie die Eingabe und mehrfach vorkommen.
function rankTranslations(source, data, target) {
  const src = source.trim().toLowerCase(), srcWords = src.split(/\s+/).length;
  const pool = new Map();
  const add = (text, quality, isMain) => {
    let t = String(text || '').trim().replace(/[.!?;:,]+$/, '');
    if (!t || t.length > 48 || /[()[\]]|MYMEMORY|https?:/i.test(t)) return;
    if (target !== 'de' && t !== t.toUpperCase()) t = t.charAt(0).toLowerCase() + t.slice(1);
    const key = t.toLowerCase();
    if (key === src) return;
    const e = pool.get(key) || { text: t, base: 0, n: 0 };
    e.n++;
    e.base = Math.max(e.base, (+quality || 0) * .3 + (isMain ? 10 : 0));
    pool.set(key, e);
  };
  add(data.responseData && data.responseData.translatedText, 0, true);
  (data.matches || []).forEach(m => add(m.translation, m.quality, false));
  return [...pool.values()]
    .map(e => ({ text: e.text, score: e.base + e.n * 8 - Math.abs(e.text.split(/\s+/).length - srcWords) * 30 }))
    .sort((a, b) => b.score - a.score)
    .map(e => e.text);
}
async function lookupTranslation(text, from, to) {
  const email = store.settings.vocabEmail.trim();
  const url = `https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${from}%7C${to}${email ? '&de=' + encodeURIComponent(email) : ''}`;
  const ctrl = new AbortController();
  const timeout = setTimeout(() => ctrl.abort(), 7000);
  try {
    const data = await (await fetch(url, { signal: ctrl.signal })).json();
    if (+data.responseStatus !== 200) throw new Error(String(data.responseDetails || data.responseStatus));
    return rankTranslations(text, data, to);
  } finally {
    clearTimeout(timeout);
  }
}
async function addVocab(text) {
  const c = activeClass();
  text = text.trim();
  if (!c || !text) return;
  const v = c.vocab, toForeign = store.settings.vocabDir === 'de2x', auto = toForeign ? 'fx' : 'de';
  const item = { id: uid(), de: toForeign ? text : '', fx: toForeign ? '' : text, auto, alts: [], pending: true, t: Date.now() };
  v.items.unshift(item);
  v.show = true;
  refreshVocab();
  try {
    const found = await lookupTranslation(text, toForeign ? 'de' : v.lang, toForeign ? v.lang : 'de');
    if (found.length) { item[auto] = found[0]; item.alts = found.slice(1, 5); }
    else toast(`Für „${text}“ hat das Wörterbuch nichts gefunden. Trag die Übersetzung selbst ein.`);
  } catch (e) {
    toast(!navigator.onLine ? 'Keine Internetverbindung. Trag die Übersetzung selbst ein.'
      : /quota|limit|used all|429/i.test(e.message) ? 'Das kostenlose Tageslimit des Wörterbuchs ist erreicht. Trag die Übersetzung selbst ein.'
      : 'Das Wörterbuch hat nicht geantwortet. Trag die Übersetzung selbst ein.');
  }
  item.pending = false;
  refreshVocab();
}
function vocabItemsHTML(c, limit) {
  const v = c.vocab, items = limit ? v.items.slice(0, limit) : v.items, lang = langName(v.lang);
  if (!items.length) return '<li class="vocab-empty muted small">Noch keine Vokabeln. Tipp ein Wort ein und drück Enter, die Übersetzung erscheint automatisch am Beamer.</li>';
  return items.map(i => `<li class="vocab-item ${i.pending ? 'pending' : ''}">

    <input type="text" class="fx" value="${esc(i.fx)}" data-change="vocab-edit" data-field="fx" data-id="${i.id}" placeholder="${i.pending ? 'Übersetze …' : esc(lang)}" aria-label="${esc(lang)}">

  <div class="page-head"><div><h1>Lautstärke</h1><p class="lead">Das Mikrofon misst den Pegel im Raum. Die Ampel springt erst um, wenn es eine Weile zu laut ist. Ein einzelnes lautes Geräusch zählt also nicht.</p></div></div>
  <div class="grid">
    <section class="panel s12">
      <div class="panel-head"><h2>Live</h2>${sourceSeg()}</div>

          ${meterHTML(true)}
          <div class="meter-scale"><span>leise</span><span>laut</span></div>
          ${micWarnHTML()}
        </div>
      </div>
      <p class="muted small">${noiseHint()}</p>
      <div class="row">
        <button class="btn" data-action="calibrate" data-live="calib" ${n.source === 'mic' ? '' : 'disabled'}>${rt.calib ? 'Messe …' : 'Grundpegel messen (5 Sek.)'}</button>
        <span class="muted small">Miss, während die Klasse in angemessener Lautstärke arbeitet. Gelb und Rot werden danach passend gesetzt.</span>
      </div>
    </section>
    <section class="panel s7">
      <div class="panel-head"><h2>Schwellen</h2></div>
      ${range('th-yellow', 'Gelb ab', 5, 95, 1, s.yellow, s.yellow)}
      ${range('th-red', 'Rot ab', 8, 100, 1, s.red, s.red)}
      ${range('sens', 'Empfindlichkeit', -20, 20, 1, s.sensitivity, (s.sensitivity > 0 ? '+' : '') + s.sensitivity)}
      ${range('tol', 'Geduld vor Rot', 0, 10, .5, s.toleranceSec, fmtNum(s.toleranceSec) + ' Sek.')}
    </section>
    <section class="panel s5">
      <div class="panel-head"><h2>Tipps</h2></div>
      <ul class="tips">
        <li>Stell den Laptop möglichst mittig in den Raum, nicht direkt neben eine laute Gruppe.</li>
        <li>Zeigt die Ampel ständig Rot, senke die Empfindlichkeit oder miss den Grundpegel neu.</li>
        <li>Ohne Mikrofon kannst du die Ampel im Modus Manuell selbst schalten. Die Sterne zählen trotzdem.</li>
      </ul>
      <label class="check"><input type="checkbox" data-change="noise-showlevel" ${s.showLevel ? 'checked' : ''}><span>Pegelbalken neben der Ampel am Beamer zeigen</span></label>
    </section>
    <section class="panel s12">
      <details class="diag" data-diag ${rt.diagOpen ? 'open' : ''}><summary>Mikrofon-Diagnose</summary>
        <p class="muted small">Zeigt, was beim Mikrofon ankommt. Hilfreich, wenn die Ampel nicht reagiert.</p>
        <pre data-live="diag"></pre>
      </details>
    </section>
  </div>`;
}

function pageKarten(c) {

  const log = store.cards.filter(k => k.classId === c.id && inRange(k.t, range)).sort((a, b) => b.t - a.t);
  const nameOf = id => { const s = c.students.find(x => x.id === id); return s ? fullName(s) : 'Entfernte Person'; };
  const cell = v => v ? v : '<span class="zero">0</span>';
  return `
  <div class="page-head">
    <div><h1>Karten</h1><p class="lead">Lob, gelbe und rote Karten mit Notizen für ${esc(c.name)}. Notizen erscheinen nie am Beamer.</p></div>
    <div class="row">${seg('card-range', [['today', 'Heute'], ['week', 'Diese Woche'], ['all', 'Alle']], range)}<button class="btn" data-action="cards-export" ${log.length ? '' : 'disabled'}>Als CSV exportieren</button></div>
  </div>
  <div class="grid">
    <section class="panel s5">
      <table class="tbl">
        <thead><tr><th>Name</th><th class="num">Lob</th><th class="num">Gelb</th><th class="num">Rot</th></tr></thead>
        <tbody>${[...c.students].sort(byLast).map(s => { const k = counts[s.id] || {}; return `<tr><td><button class="link" data-action="student" data-id="${s.id}">${esc(fullName(s))}</button></td><td class="num">${cell(k.green)}</td><td class="num">${cell(k.yellow)}</td><td class="num">${cell(k.red)}</td></tr>`; }).join('') || '<tr><td colspan="4" class="muted">Noch keine SuS.</td></tr>'}</tbody>
      </table>
    </section>
    <section class="panel s7">

      ${log.length ? `<ul class="log">${log.map(k => `<li>

        <div class="log-main"><div><strong>${esc(nameOf(k.studentId))}</strong> <span class="muted small">${CARD[k.type].long}, ${fmtWhen(k.t)}</span></div>${k.note ? `<div class="log-note">${esc(k.note)}</div>` : ''}</div>
        <button class="btn ghost small" data-action="card-delete" data-id="${k.id}">Löschen</button>
      </li>`).join('')}</ul>` : '<p class="muted">Keine Einträge im gewählten Zeitraum. Karten vergibst du über einen Klick auf einen Namen.</p>'}
    </section>
  </div>`;
}

function pageSterne(c) {

  return `
  <div class="page-head"><div><h1>Sterne</h1><p class="lead">Solange die Ampel grün ist, füllt sich der Stern. Nach ${mps} ${mps === 1 ? 'Minute' : 'Minuten'} Grün bekommt die Klasse einen Stern. Mit genug Sternen erreicht sie ihr Klassenziel.</p></div></div>
  <div class="grid">
    <section class="panel s7">
      <div class="panel-head"><h2>${esc(c.name)}</h2></div>
      ${starsBlock(c)}

        <div><dt>Ruhequote</dt><dd>${quiet}</dd></div>
        <div><dt>Aktuelle Serie</dt><dd data-live="streak">0:00</dd></div>

        <p class="muted small">${r.goal.reachedAt ? `Erreicht am ${new Date(r.goal.reachedAt).toLocaleDateString('de-DE')}. Starte das Ziel neu, wenn die Belohnung eingelöst ist.` : 'Das Ziel zählt alle Sterne seit dem letzten Neustart.'}</p>

      <div class="setting"><span>Bei Rot</span>${seg('set', [['pause', 'Stern wartet'], ['reset', 'Stern fängt von vorn an'], ['minus', 'Ein Stern weniger']], st.redPolicy, 'data-key="redPolicy"')}</div>

    </section>

      <div class="panel-head"><h2>Klassen-Liga</h2><button class="btn" data-action="liga-show" ${liga.length > 1 ? '' : 'disabled'}>Am Beamer zeigen</button></div>
      ${liga.length > 1 ? `

        <table class="tbl" style="margin-top:12px"><thead><tr><th>Platz</th><th>Klasse</th><th class="num">Sterne</th><th class="num">je 45 Min.</th></tr></thead>

      <div class="row"><button class="btn danger" data-action="stars-reset">Alle Sterne von ${esc(c.name)} zurücksetzen</button><span class="muted small">Löscht Sterne, Wochenwerte und Rekord dieser Klasse.</span></div>

function importPreview() {
  const imp = rt.imp, recs = importRecords();
  const fileClasses = [...new Set(recs.map(r => r.cls).filter(Boolean))];
  const canColumn = imp.map.includes('class');
  if (imp.target === 'column' && !canColumn) imp.target = activeClass() ? 'existing' : 'new';
  if (imp.target === 'existing' && !store.classes.length) imp.target = 'new';
  const sample = recs.slice(0, 4).map(r => esc([r.first, r.last].filter(Boolean).join(' '))).join(', ');
  return `<div class="imp">
    <h3>Vorschau${imp.fileName ? ` von ${esc(imp.fileName)}` : ''}</h3>
    <p class="muted small">Lege für jede Spalte fest, was sie enthält.</p>
    <div class="table-wrap"><table class="imp-table">
      <thead><tr>${imp.map.map((role, i) => `<th><select class="input" data-change="imp-map" data-col="${i}" aria-label="Inhalt von Spalte ${i + 1}">${ROLE_OPTIONS.map(([v, l]) => `<option value="${v}" ${v === role ? 'selected' : ''}>${l}</option>`).join('')}</select></th>`).join('')}</tr></thead>
      <tbody>${imp.rows.slice(0, 7).map((r, ri) => `<tr class="${ri === 0 && imp.hasHeader ? 'is-head' : ''}">${r.map(v => `<td>${esc(v)}</td>`).join('')}</tr>`).join('')}</tbody>
    </table></div>
    ${imp.rows.length > 7 ? `<p class="muted small">und ${imp.rows.length - 7} weitere Zeilen</p>` : ''}
    <div class="row">
      <label class="check"><input type="checkbox" data-change="imp-header" ${imp.hasHeader ? 'checked' : ''}><span>Erste Zeile ist eine Überschrift</span></label>
      <button class="btn ghost" data-action="imp-swap">Vor- und Nachname tauschen</button>

      ${store.classes.length ? `<label class="check"><input type="radio" name="imp-target" value="existing" data-change="imp-target" ${imp.target === 'existing' ? 'checked' : ''}><span>In die Klasse</span><select class="input" data-change="imp-class" aria-label="Bestehende Klasse">${store.classes.map(k => `<option value="${k.id}" ${k.id === imp.classId ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select></label>` : ''}
      <label class="check"><input type="radio" name="imp-target" value="new" data-change="imp-target" ${imp.target === 'new' ? 'checked' : ''}><span>In eine neue Klasse</span><input type="text" value="${esc(imp.newName)}" data-input="imp-newname" placeholder="Name, z. B. 7b" aria-label="Name der neuen Klasse"></label>
    </fieldset>
    <div class="row">
      <button class="btn primary" data-action="imp-run" ${recs.length ? '' : 'disabled'}>${recs.length} SuS importieren</button>
      <button class="btn ghost" data-action="imp-cancel">Abbrechen</button>
    </div>
  </div>`;
}

const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');

  $('#nav').innerHTML = PAGES.map(([id, label, ic]) => `<button data-action="nav" data-page="${id}" ${rt.page === id ? 'aria-current="page"' : ''}>${icon(ic)}<span>${label}</span></button>`).join('');

    <div class="class-pick">
      ${store.classes.length ? `<label for="classSel">Klasse</label><select id="classSel" data-change="class-select">${store.classes.map(k => `<option value="${k.id}" ${k.id === store.activeClassId ? 'selected' : ''}>${esc(k.name)}</option>`).join('')}</select>` : '<span class="muted">Noch keine Klasse</span>'}
    </div>
    <div class="status" data-live="beamer-status"></div>
    <div class="status" data-live="top-timer" hidden></div>
    <span class="spacer"></span>
    <button class="btn ghost icon-only" data-action="ui-toggle" aria-label="${dark ? 'Helles Design' : 'Dunkles Design'}" title="${dark ? 'Helles Design' : 'Dunkles Design'}">${icon(dark ? 'sun' : 'moon')}</button>

function openStudentDialog(id) {
  const c = activeClass(), s = c && c.students.find(x => x.id === id);
  if (!s) return;
  rt.dlgStudent = id;
  const absent = s.absentOn === todayKey();
  const week = cardCountsMap(c.id, 'week')[id] || { green: 0, yellow: 0, red: 0 };
  const today = store.cards.filter(k => k.studentId === id && inRange(k.t, 'today')).sort((a, b) => b.t - a.t);

function syncThresholdUI() {
  const s = store.settings.noise;
  $$('.meter').forEach(m => { m.style.setProperty('--y', s.yellow + '%'); m.style.setProperty('--r', s.red + '%'); });
  const set = (key, value, text) => {
    const input = $(`[data-input="${key}"]`), out = $(`[data-out="${key}"]`);
    if (input && +input.value !== value) input.value = value;
    if (out) out.textContent = text;
  };
  set('th-yellow', s.yellow, s.yellow);
  set('th-red', s.red, s.red);
  set('sens', s.sensitivity, (s.sensitivity > 0 ? '+' : '') + s.sensitivity);
  set('tol', s.toleranceSec, fmtNum(s.toleranceSec) + ' Sek.');
  save();
  pushState();
}
const inputs = {
  message: el => { store.message = el.value; save(); pushState(); },
  'timer-label': el => { store.timer.label = el.value; save(); pushState(); },
  'imp-newname': el => { rt.imp.newName = el.value; },
  'th-yellow': el => { const s = store.settings.noise; s.yellow = +el.value; if (s.red < s.yellow + 3) s.red = Math.min(100, s.yellow + 3); syncThresholdUI(); },
  'th-red': el => { const s = store.settings.noise; s.red = +el.value; if (s.yellow > s.red - 3) s.yellow = Math.max(0, s.red - 3); syncThresholdUI(); },
  sens: el => { store.settings.noise.sensitivity = +el.value; syncThresholdUI(); },
  tol: el => { store.settings.noise.toleranceSec = +el.value; syncThresholdUI(); },
};
const submits = {
  'vocab-add': f => { const input = f.elements.word, text = input.value; input.value = ''; input.focus(); addVocab(text); },
  'class-add': f => {
    const name = f.elements.name.value.trim();
    if (!name) return;
    if (store.classes.some(k => k.name.toLowerCase() === name.toLowerCase())) { toast(`Eine Klasse ${name} gibt es schon.`); return; }
    const c = newClass(name);
    store.classes.push(c);
    store.activeClassId = c.id;
    commit();
    toast(`Klasse ${name} angelegt.`);
  },
  'stu-add': f => {
    const c = activeClass();
    const lines = f.elements.names.value.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
    lines.forEach(l => { const { first, last } = splitFull(l); c.students.push({ id: uid(), first, last }); });
    c.students.sort(byLast);
    commit();
    if (lines.length) toast(`${lines.length} ${lines.length === 1 ? 'Person' : 'Personen'} hinzugefügt.`);
  },
  'timer-custom': f => {
    const sec = (+f.elements.min.value || 0) * 60 + (+f.elements.sec.value || 0);
    if (sec < 1) { toast('Gib eine Zeit von mindestens einer Sekunde ein.'); return; }
    timerSet(sec);
  },
};

  document.body.classList.add('dash');
  $('#app').innerHTML = `

        <nav class="nav" id="nav" aria-label="Bereiche"></nav>

      </div>
    </div>
    <dialog id="dlg" aria-label="Schüler:in"></dialog>
    <div class="toasts" id="toasts" aria-live="polite"></div>`;

  document.addEventListener('click', e => {
    const el = e.target.closest('[data-action]');
    if (el && !el.disabled && actions[el.dataset.action]) { e.preventDefault(); actions[el.dataset.action](el, e); return; }
    const dlg = $('#dlg');
    if (e.target === dlg) dlg.close();   // Klick auf den Hintergrund
  });
  document.addEventListener('change', e => { const el = e.target.closest('[data-change]'); if (el && changes[el.dataset.change]) changes[el.dataset.change](el, e); });
  document.addEventListener('input', e => { const el = e.target.closest('[data-input]'); if (el && inputs[el.dataset.input]) inputs[el.dataset.input](el, e); });
  document.addEventListener('submit', e => { const f = e.target.closest('[data-submit]'); if (f) { e.preventDefault(); submits[f.dataset.submit](f); } });
  document.addEventListener('toggle', e => {
    if (!e.target.matches || !e.target.matches('details')) return;
    if (e.target.matches('[data-diag]')) rt.diagOpen = e.target.open;
    else rt.pasteOpen = e.target.open;
  }, true);
  $('#dlg').addEventListener('close', () => { rt.dlgStudent = null; });

  // Dateien nur in der Ablagefläche annehmen, sonst würde der Browser sie öffnen
  window.addEventListener('dragover', e => {
    e.preventDefault();
    $$('.drop').forEach(d => d.classList.toggle('over', d.contains(e.target)));
  });
  window.addEventListener('dragleave', e => { if (!e.relatedTarget) $$('.drop').forEach(d => d.classList.remove('over')); });
  window.addEventListener('drop', e => {
    e.preventDefault();
    const zone = e.target.closest && e.target.closest('.drop');
    $$('.drop').forEach(d => d.classList.remove('over'));
    if (zone && e.dataTransfer.files[0]) readImportFile(e.dataTransfer.files[0]);
  });

  document.addEventListener('pointerdown', () => getAudio(), { once: true });
  window.addEventListener('beforeunload', saveNow);
  document.addEventListener('visibilitychange', () => {
    diagLog(document.hidden ? 'Fenster verdeckt' : 'Fenster sichtbar');
    if (document.hidden) saveNow();
  });

  darkQuery.addEventListener('change', () => { if (store.settings.uiTheme === 'auto') renderAll(); });
  // Tastenkürzel, solange nicht in ein Feld getippt wird
  document.addEventListener('keydown', e => {
    if (e.metaKey || e.ctrlKey || e.altKey || $('#dlg').open || e.target.closest('input, textarea, select')) return;
    const key = e.key.toLowerCase();
    if (key === 'z') { e.preventDefault(); pickRandom(); }
    else if (key === ' ' && !e.target.closest('button, a, summary, label')) { e.preventDefault(); timerToggle(); }
    else if (key === 'v') { const input = $('[data-focus-key="vocab"]'); if (input) { e.preventDefault(); input.focus(); } }
  });
  listen(onDashMessage);
  renderAll();
  setInterval(engineTick, 100);
}

function applyState(st) {
  B.st = st;
  B.lastAt = Date.now();
  const root = $('#bm');
  root.dataset.theme = st.theme;
  $('#bmClass').textContent = st.className;
  const msg = $('#bmMsg');
  msg.textContent = st.message;
  msg.hidden = !st.message.trim();

  const n = st.noise;
  root.classList.toggle('no-ampel', n.source === 'off');
  $('#housing').dataset.light = n.light;
  const showLevel = n.source === 'mic' && n.showLevel;
  $('#levelbar').hidden = !showLevel;
  if (showLevel) {
    $('#lvlFill').style.height = clamp(n.level, 0, 100) + '%';
    $('#mkY').style.bottom = n.yellow + '%';
    $('#mkR').style.bottom = n.red + '%';
  }
  if (n.light === 'red' && B.lastLight !== 'red' && B.lastLight !== 'off') shakeStar();
  B.lastLight = n.light;

  const vb = st.vocab;
  root.classList.toggle('vocab-on', !!vb);
  if (vb) {
    $('#bmVocabLang').textContent = vb.lang;
    const key = JSON.stringify(vb.items);
    if (key !== B.vocabKey) {
      const top = vb.items[0] ? vb.items[0].id : '', fresh = top !== B.vocabTop;
      B.vocabKey = key;
      B.vocabTop = top;
      const cell = (v, pending) => v ? esc(v) : pending ? '…' : '';
      $('#bmVocabList').innerHTML = vb.items.map((i, k) => `<li class="${k === 0 ? 'latest' : ''}${k === 0 && fresh ? ' new' : ''}"><div class="fx">${cell(i.fx, i.pending)}</div><div class="de">${cell(i.de, i.pending)}</div></li>`).join('');
    }
  }

  const r = st.reward;
  $('#bmBottom').hidden = !r;
  if (!r) return;
  $('#bmStarTotal').textContent = r.total;
  $('#bmStarUnit').textContent = r.total === 1 ? 'Stern' : 'Sterne';
  $('#bmStarFill').style.transform = `scaleY(${r.progress})`;
  $('#bmStarStatus').textContent = starStatus(n.source, n.light, r.nextInSec, r.yellowPolicy, r.redPolicy);
  renderGoal(r);
  $('#bmLiga').innerHTML = r.rank ? `<strong>Platz ${r.rank}</strong>von ${r.classes} Klassen` : '';
}
function renderGoal(r) {
  const box = $('#bmGoal');
  box.hidden = !r.goalTarget;
  if (!r.goalTarget) return;
  const done = Math.min(r.goalDone, r.goalTarget);
  $('#bmGoalTitle').textContent = r.goalReached
    ? `Ziel erreicht${r.goalReward ? ': ' + r.goalReward : '!'}`
    : r.goalReward ? `Ziel: ${r.goalReward}` : 'Unser Klassenziel';
  const key = `${done}/${r.goalTarget}`;
  if (B.goalKey === key) return;
  B.goalKey = key;
  const count = `<span class="goal-count">${done} / ${r.goalTarget}</span>`;
  if (r.goalTarget <= 40) {
    const cols = r.goalTarget <= 10 ? r.goalTarget : r.goalTarget <= 20 ? 10 : 20;
    const max = r.goalTarget <= 10 ? 6 : r.goalTarget <= 20 ? 5 : 3.4;
    $('#bmGoalTrack').innerHTML = `<div class="slots" style="--cols:${cols};--max:${max}vmin">${Array.from({ length: r.goalTarget }, (_, i) => `<svg class="slot ${i < done ? 'on' : ''}" viewBox="0 0 100 100" aria-hidden="true"><polygon points="${STAR_POINTS}"/></svg>`).join('')}</div>${count}`;
  } else {
    $('#bmGoalTrack').innerHTML = `<div class="goal-bar"><span style="width:${done / r.goalTarget * 100}%"></span></div>${count}`;
  }
}

function beamerTick() {
  const now = new Date();
  const hm = `${pad(now.getHours())}:${pad(now.getMinutes())}`;
  setText('bmHM', hm);
  setText('bmS', pad(now.getSeconds()));
  setText('bmTime', hm);
  $('#bmDate').textContent = now.toLocaleDateString('de-DE', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  const root = $('#bm'), t = B.st && B.st.timer, on = !!t && t.state !== 'idle';
  root.classList.toggle('timer-on', on);
  if (on) {
    const rem = timerRemaining(t);
    const digits = fmtDur(rem);
    setText('bmTimerDigits', digits);
    $('#bmTimer').classList.toggle('long', digits.length > 5);
    $('#bmTimerBar').style.width = (t.durationSec ? clamp(rem / t.durationSec, 0, 1) * 100 : 0) + '%';
    $('#bmTimerLabel').textContent = t.label || '';
    $('#bmTimerState').textContent = t.state === 'paused' ? 'Pausiert' : t.state === 'done' ? 'Die Zeit ist um' : '';
    const box = $('#bmTimer');
    box.classList.toggle('end', rem <= 10);
    box.classList.toggle('warn', rem > 10 && rem <= 60 && t.durationSec >= 180);
    box.classList.toggle('paused', t.state === 'paused');
    box.classList.toggle('running', t.state === 'running');
  }
  const stale = !B.lastAt || Date.now() - B.lastAt > 5000;
  root.classList.toggle('stale', stale);
  $('#bmHint').hidden = !stale;
}

function showOverlay(html, ms = 9000, cls = '') {
  clearTimeout(B.overlayTimer);
  clearTimeout(B.rollTimer);
  const ov = $('#bmOverlay');
  ov.className = 'bm-overlay show ' + cls;
  ov.innerHTML = html;
  if (ms) B.overlayTimer = setTimeout(hideOverlay, ms);
}
function hideOverlay() {
  clearTimeout(B.overlayTimer);
  clearTimeout(B.rollTimer);
  const ov = $('#bmOverlay');
  ov.className = 'bm-overlay';
  ov.innerHTML = '';
}
function overlayPick({ name, roll }) {
  showOverlay('<div><div class="ov-small">Du bist dran</div><div class="ov-name" id="rollName"></div></div>', 0);
  const el = $('#rollName'), small = $('#bmOverlay .ov-small');
  const finish = () => {
    el.textContent = name;
    el.className = 'ov-name final';
    small.style.visibility = 'visible';
    B.overlayTimer = setTimeout(hideOverlay, 9000);
  };
  if (!roll || roll.length < 2 || REDUCED_MOTION) { finish(); return; }
  small.style.visibility = 'hidden';
  el.className = 'ov-name rolling';
  const start = performance.now(), total = 2300;
  let i = 0;
  (function step() {
    const t = performance.now() - start;
    if (t >= total) { finish(); return; }
    el.textContent = roll[i++ % roll.length];
    B.rollTimer = setTimeout(step, 55 + Math.pow(t / total, 2) * 300);
  })();
}
function overlayCard({ type, name }) {
  const kind = { green: 'Lob!', yellow: 'Gelbe Karte', red: 'Rote Karte' }[type];
  const inner = type === 'green' ? `<svg viewBox="0 0 24 24" aria-hidden="true">${ICONS.star}</svg>` : '';
  showOverlay(`<div class="ov-card"><div class="ref-card ${type}">${inner}</div><div class="ov-card-text"><div class="ov-name">${esc(name)}</div><div class="ov-card-kind">${kind}</div></div></div>`, 7000);
}
function overlayGoal({ reward, target }) {
  showOverlay(`<div class="ov-goal">${starSVG({ clip: 'clipGoal' })}<div class="ov-big">Ziel erreicht!</div><div class="ov-sub">${reward ? esc(reward) : `${target} Sterne gesammelt`}</div></div>`, 14000);
  confetti();
}
function overlayTimerEnd({ label }) {
  showOverlay(`<div><div class="ov-big">Die Zeit ist um</div>${label ? `<div class="ov-sub">${esc(label)}</div>` : ''}</div>`, 8000);
}
function overlayLiga({ subtitle, rows }) {
  const max = Math.max(1e-9, ...rows.map(r => r.value));
  showOverlay(`<div class="ov-liga"><h2>Klassen-Liga</h2><div class="ov-small">${esc(subtitle)}</div>${rows.map((r, i) => `<div class="liga-row ${r.me ? 'me' : ''}"><span class="liga-rank">${i + 1}.</span><span class="liga-name">${esc(r.name)}</span><span class="liga-bar"><span style="width:${r.value / max * 100}%"></span></span><span class="liga-val">${esc(r.label)}</span></div>`).join('')}</div>`, 16000, 'liga');
}
function bmToast(text) {
  const el = document.createElement('div');
  el.className = 'bm-toast';
  el.textContent = text;
  $('#bmToasts').appendChild(el);
  setTimeout(() => el.remove(), 6000);
}
function starPop(n) {
  const box = $('#bmStar');
  if (!box) return;
  box.classList.remove('pop');
  void box.offsetWidth;
  box.classList.add(n > 0 ? 'pop' : 'shake');
  const plus = document.createElement('span');
  plus.className = 'plus' + (n < 0 ? ' minus' : '');
  plus.textContent = n > 0 ? `+${n}` : `−${-n}`;
  box.appendChild(plus);
  setTimeout(() => { plus.remove(); box.classList.remove('pop', 'shake'); }, 1600);
}
function shakeStar() {
  const box = $('#bmStar');
  if (!box) return;
  box.classList.remove('shake');
  void box.offsetWidth;
  box.classList.add('shake');
  setTimeout(() => box.classList.remove('shake'), 600);
}
function confetti() {
  if (REDUCED_MOTION) return;
  const cv = $('#bmConfetti'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  const W = cv.width = innerWidth * dpr, H = cv.height = innerHeight * dpr;
  const colors = ['#F3BE5C', '#8FB0E8', '#5CC98A', '#F26B55', '#FFFFFF'];
  const parts = Array.from({ length: 190 }, (_, i) => ({
    x: Math.random() * W, y: -Math.random() * H * .6,
    vx: (Math.random() - .5) * 5 * dpr, vy: (2 + Math.random() * 4) * dpr,
    w: (6 + Math.random() * 8) * dpr, h: (4 + Math.random() * 5) * dpr,
    a: Math.random() * Math.PI, va: (Math.random() - .5) * .3, c: colors[i % colors.length],
  }));
  const start = performance.now();
  (function frame(t) {
    ctx.clearRect(0, 0, W, H);
    for (const p of parts) {
      p.x += p.vx; p.y += p.vy; p.vy += .06 * dpr; p.a += p.va;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.a); ctx.fillStyle = p.c;
      ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); ctx.restore();
    }
    if (t - start < 5000) requestAnimationFrame(frame);
    else ctx.clearRect(0, 0, W, H);
  })(start);
}
function handleEvent(name, d) {
  if (name === 'pick') overlayPick(d);
  else if (name === 'card') overlayCard(d);
  else if (name === 'goal') overlayGoal(d);
  else if (name === 'timerEnd') overlayTimerEnd(d);
  else if (name === 'liga') overlayLiga(d);
  else if (name === 'record') bmToast(`Neuer Ruhe-Rekord! Länger als ${fmtDur(d.sec)} Minuten am Stück leise`);
  else if (name === 'star') starPop(d.n);
  else if (name === 'hide') hideOverlay();
}
function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
  else document.documentElement.requestFullscreen().catch(() => {});
}

function initHostedHint() {
  document.body.classList.add('dash');
  document.documentElement.dataset.ui = darkQuery.matches ? 'dark' : 'light';
  $('#app').innerHTML = `<main class="page"><div class="empty" data-hosted>
    <h1>Erst laden, dann öffnen</h1>
    <p class="lead">Der Teaching Assistant läuft auf deinem Rechner, nicht auf classtiles.de. Lade die Datei herunter und öffne sie am besten in Chrome. Deine Klassen bleiben dann in deinem Browser.</p>
    <div class="row">
      <a class="btn primary lg" href="${esc(location.pathname)}" download="teaching-assistant.html">Datei laden</a>
      <a class="btn lg" href="https://classtiles.de/ki-teaching-assistant.html">Zur Beschreibung</a>
    </div>
  </div></main>`;
}

function initBeamer() {
  document.body.classList.add('beamer');
  document.title = 'Teaching Assistant Beamer';
  $('#app').innerHTML = beamerHTML();
  peerWin = window.opener || null;
  listen((msg, source) => {
    if (source && !peerWin) peerWin = source;
    if (msg.type === 'state') applyState(msg.state);
    else if (msg.type === 'event') handleEvent(msg.name, msg.data || {});
  });
  send('hello');
  setInterval(() => send('ping'), 2000);
  setInterval(beamerTick, 200);
  beamerTick();

  $$('.bm-ctl').forEach(btn => btn.addEventListener('click', () => {
    if (btn.dataset.cmd === 'fullscreen') toggleFullscreen();
    else send('command', { cmd: btn.dataset.cmd });
  }));
  let idleTimer = 0;
  const wake = () => {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 2500);
  };
  document.addEventListener('mousemove', wake);
  wake();
  document.addEventListener('keydown', e => {
    if (e.key === 'f' || e.key === 'F') toggleFullscreen();
    else if (e.key === 'Escape') hideOverlay();
    else if (e.key === ' ') { e.preventDefault(); send('command', { cmd: 'timer' }); }
    else if (e.key === 'z' || e.key === 'Z') send('command', { cmd: 'pick' });
  });
}

if (HOSTED) initHostedHint(); else if (IS_BEAMER) initBeamer(); else initDashboard();
</script>
